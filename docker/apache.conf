# Apache for the Luganda app: public/ is the web root; public/.htaccess does the rest
# (pretty URLs, long caching for recordings and built files, no-cache for sw.js).
Listen ${PORT}
<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html/public
    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
    ServerTokens Prod
    ServerSignature Off
</VirtualHost>
